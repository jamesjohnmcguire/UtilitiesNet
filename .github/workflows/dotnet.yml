name: .NET

on:
  push:
    branches: [main]
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package from main after tests pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UtilitiesNet.slnx -p:Configuration=Debug

      - name: Build
        run: dotnet build UtilitiesNet.slnx -c Debug --no-restore

      - name: Test
        run: >-
          dotnet test UtilitiesNet.slnx -c Debug --no-build --no-restore
          --verbosity normal

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches package version
        if: github.event_name == 'push'
        working-directory: UtilitiesNetLibrary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild -nologo -getProperty:Version)
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag does not match package version $version."
            exit 1
          fi

      - name: Build Release package
        working-directory: UtilitiesNetLibrary
        run: >-
          dotnet pack -c Release --output ../artifacts
          -p:GeneratePackageOnBuild=false

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: jamesjohnmcguire

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
