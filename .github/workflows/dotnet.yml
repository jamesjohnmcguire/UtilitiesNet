name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UtilitiesNet.slnx -p:Configuration=Debug

      - name: Build
        run: dotnet build UtilitiesNet.slnx -c Debug --no-restore

      - name: Test
        run: >-
          dotnet test UtilitiesNet.slnx -c Debug --no-build --no-restore
          --verbosity normal
